server:
  port: 8010

spring:
  application:
    name: datalens-backend
  datasource:
    # busy_timeout makes a connection wait (rather than fail immediately with SQLITE_BUSY) when
    # another connection briefly holds the file lock; maximum-pool-size:1 matches SQLite's single-
    # writer model so the app doesn't hand itself multiple connections that contend for that lock.
    url: jdbc:sqlite:file:../backend/beeline_meta.db?mode=rwc&busy_timeout=30000
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s

datalens:
  config-path: ../backend/config/settings.yaml
  api-prefix: /api/v1
  metadata-sync-interval-ms: 3600000

springdoc:
  api-docs:
    path: /api/openapi.json
  swagger-ui:
    path: /api/docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} | %-7level | %logger{36} | %m%n"
  level:
    com.datalens: INFO
    org.hibernate.SQL: WARN
