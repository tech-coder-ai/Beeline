[project]
name = "story-pipeline"
version = "0.1.0"
description = "Story-to-YouTube production pipeline: discovery, rights, adaptation, visuals, voices, rendering, QC, publishing"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "pillow>=10.0",
]

[project.optional-dependencies]
youtube = ["google-api-python-client>=2.130", "google-auth-oauthlib>=1.2"]
tts = ["kokoro-onnx>=0.4", "soundfile>=0.12"]
diffusers = ["torch>=2.3", "diffusers>=0.32", "transformers>=4.44", "accelerate>=0.33", "sentencepiece", "protobuf"]
piper = ["piper-tts>=1.2"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
